<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multi Phục Pro P.128</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3845/3845868.png">
</head>
<body>

    <header onclick="secretKnock()">
        <h1>Multi Phục Pro P.128</h1>
        <p id="weather-status">Hệ thống đang sẵn sàng...</p>
    </header>

    <div class="container">
        <div class="tabs glass-panel">
            <button class="tab-btn active" onclick="switchTab('video')">Video</button>
            <button class="tab-btn" onclick="switchTab('music')">Nhạc</button>
            <button class="tab-btn" onclick="switchTab('tools')">Tiện ích</button>
        </div>

        <div id="video" class="section active">
            <div id="video-container" class="media-grid"></div>
        </div>

        <div id="music" class="section">
            <div id="music-container" class="media-grid"></div>
        </div>

        <div id="tools" class="section">
            <div class="tools-grid">
                <div class="tool-item glass-panel" id="install-card" style="display:none;" onclick="triggerInstall()">
                    <span class="tool-icon">📲</span>
                    <span class="tool-name">Cài đặt App</span>
                </div>
                <div class="tool-item glass-panel" onclick="fetchNCTMusic()">
                    <span class="tool-icon">🎧</span>
                    <span class="tool-name">NCT Trending</span>
                </div>
                <div class="tool-item glass-panel" onclick="fetchTikTokVideos()">
                    <span class="tool-icon">📱</span>
                    <span class="tool-name">TikTok Nổi Bật</span>
                </div>
                <div class="tool-item glass-panel" onclick="getAIAdvice()">
                    <span class="tool-icon">🧠</span>
                    <span class="tool-name">AI Trợ Lý</span>
                </div>
            </div>
            <div id="tool-output" class="glass-panel" style="display: none; margin-top: 20px;"></div>
        </div>
    </div>

    <div id="mini-player" class="glass-panel" style="display: none;">
        <div class="mini-art" id="mini-icon">🎵</div>
        <div class="mini-info">
            <div class="mini-title" id="mini-title">Đang phát...</div>
            <div class="mini-artist" id="mini-artist">Multi Phục Pro</div>
        </div>
        <div class="mini-controls">
            <button class="mini-btn" id="pip-btn" onclick="togglePiP()">🖼️</button>
            <button class="mini-btn" onclick="toggleMiniPlayer()" id="mini-pp-icon">⏸️</button>
            <button class="mini-btn close-btn" onclick="closeMiniPlayer()">✖</button>
        </div>
    </div>

    <div id="custom-alert" class="modal-overlay">
        <div class="alert-box glass-panel">
            <div class="alert-header">👑 Chào Sếp Phục Pro</div>
            <div class="alert-body" id="alert-message">Nội dung thông báo</div>
            <button class="alert-btn" onclick="closeAlert()">Đã Rõ</button>
        </div>
    </div>

    <div id="admin-login-modal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <h2>🔐 Admin Login</h2>
            <input type="password" id="admin-pin" class="glass-input" placeholder="Nhập PIN..." inputmode="numeric">
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-cancel" onclick="closeAdminLogin()">Hủy</button>
                <button class="btn btn-primary" onclick="verifyAdmin()">Mở Khóa</button>
            </div>
        </div>
    </div>

    <div id="admin-panel-modal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <h2>➕ Thêm Media</h2>
            <select id="media-type" class="glass-input">
                <option value="video">🎥 Video</option>
                <option value="music">🎵 Nhạc</option>
            </select>
            <input type="text" id="media-title" class="glass-input" placeholder="Tiêu đề">
            <input type="text" id="media-author" class="glass-input" placeholder="Tác giả">
            <input type="text" id="media-url" class="glass-input" placeholder="Link (mp4/mp3)">
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-cancel" onclick="closeAdminPanel()">Đóng</button>
                <button class="btn btn-success" onclick="saveCustomMedia()">Lưu</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav glass-panel">
        <div class="nav-item active">🏠<br>Trang chủ</div>
        <div class="nav-item">📁<br>Tập tin</div>
        <div class="nav-item" onclick="location.reload()">🔄<br>Làm mới</div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
